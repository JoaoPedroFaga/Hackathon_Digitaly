<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta · Digitaly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --grafite-950:#0B0D10; --grafite-900:#121417; --grafite-800:#1B1E23;
  --grafite-700:#262A31; --grafite-600:#3A3F48; --grafite-500:#5B6270;
  --grafite-400:#7D8494; --grafite-300:#A5ACB8; --grafite-200:#CFD4DC;
  --grafite-100:#E6E9EE; --grafite-50:#F5F7FA; --branco:#FFFFFF;
  --celeste-700:#0069AB; --celeste-600:#0084D6; --celeste-500:#009FFF;
  --celeste-400:#33B3FF; --celeste-300:#66C6FF;
  --grad-marca:linear-gradient(135deg,#009FFF 0%,#4CC9FF 100%);
  --fonte-display:'Inter',system-ui,sans-serif;
  --fonte-texto:'Inter',system-ui,sans-serif;
  --fonte-dados:'IBM Plex Sans',system-ui,sans-serif;
  --t-xs:12px; --t-sm:13px; --t-md:15px; --t-lg:17px; --t-3xl:32px;
  --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px;
  --r-md:12px; --r-lg:16px; --r-pill:999px;
  --dur-base:200ms; --ease:cubic-bezier(.2,.8,.2,1);
  --erro:#EF4444;
  --glow:0 0 0 1px rgba(0,159,255,.35),0 12px 40px rgba(0,159,255,.22);
}

[data-theme="dark"]{
  --bg:var(--grafite-950); --bg-elev:var(--grafite-900);
  --borda:rgba(255,255,255,.08); --borda-forte:rgba(255,255,255,.16);
  --texto:var(--grafite-50); --texto-2:var(--grafite-300); --texto-3:var(--grafite-500);
  --vidro:rgba(255,255,255,.05); --vidro-borda:rgba(255,255,255,.12); --marca-texto:var(--celeste-400);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:var(--fonte-texto);
  font-size:var(--t-md);
  line-height:1.6;
  color:var(--texto);
  background:var(--bg);
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:80px 24px 40px;
}

h1{
  font-family:var(--fonte-display);
  font-weight:100;
  font-size:var(--t-3xl);
  line-height:1.2;
}

p{color:var(--texto-2)}
a{color:var(--marca-texto);text-decoration:none}
a:hover{text-decoration:underline}

.logo{
  position:fixed;
  top:var(--s-6);
  left:var(--s-6);
  display:flex;
  align-items:center;
  gap:8px;
  font-family:var(--fonte-display);
  font-weight:500;
  font-size:var(--t-lg);
  color:var(--texto);
}

.logo i{
  width:22px;
  height:22px;
  border-radius:6px;
  background:var(--grad-marca);
  display:inline-block;
}

.painel{
  width:100%;
  max-width:560px;
}

.painel .tag{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:var(--fonte-dados);
  font-size:var(--t-xs);
  color:var(--texto-2);
  padding:6px 12px;
  border:1px solid var(--borda);
  border-radius:var(--r-pill);
  margin-bottom:var(--s-5);
}

.painel .tag i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--celeste-500);
  box-shadow:0 0 10px var(--celeste-500);
}

.painel h1{margin-bottom:var(--s-2)}
.painel > p{margin-bottom:var(--s-8)}

form{
  display:flex;
  flex-direction:column;
  gap:var(--s-5);
}

.linha{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--s-4);
}

.campo{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.campo label{
  font-size:var(--t-sm);
  color:var(--texto-2);
}

.campo input,
.campo select{
  width:100%;
  height:48px;
  padding:0 var(--s-5);
  border-radius:var(--r-pill);
  border:1px solid var(--borda-forte);
  background:var(--bg-elev);
  color:var(--texto);
  font-family:var(--fonte-texto);
  font-size:var(--t-md);
  transition:border-color var(--dur-base) var(--ease);
}

.campo select{
  cursor:pointer;
  appearance:auto;
}

.campo input::placeholder{color:var(--texto-3)}

.campo input:focus,
.campo select:focus{
  outline:0;
  border-color:var(--celeste-500);
  box-shadow:0 0 0 3px rgba(0,159,255,.2);
}

.campo input.erro,
.campo select.erro{
  border-color:var(--erro);
}

.campo .ajuda{
  font-size:var(--t-xs);
  color:var(--texto-3);
  min-height:18px;
}

.campo .ajuda.erro{color:var(--erro)}

.endereco{
  display:grid;
  grid-template-columns:1fr 140px;
  gap:var(--s-4);
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  height:48px;
  border-radius:var(--r-pill);
  font-family:var(--fonte-texto);
  font-weight:500;
  font-size:var(--t-md);
  border:0;
  cursor:pointer;
  transition:box-shadow var(--dur-base) var(--ease);
  margin-top:var(--s-2);
}

.btn-primario{
  background:var(--grad-marca);
  color:#fff;
}

.btn-primario:hover{box-shadow:var(--glow)}

.rodape-painel{
  margin-top:var(--s-8);
  text-align:center;
  font-size:var(--t-sm);
  color:var(--texto-3);
}

@media(max-width:600px){
  body{padding-top:90px}
  .linha,
  .endereco{
    grid-template-columns:1fr;
    gap:var(--s-5);
  }
}
</style>
</head>

<body>

<a href="home.html" class="logo"><i></i>Digitaly</a>

<div class="painel">
  <span class="tag"><i></i>Área do médico e do paciente</span>

  <h1>Criar sua conta</h1>
  <p>Preencha seus dados para criar uma conta e acessar a plataforma Digitaly.</p>

  <form id="formCadastro" novalidate>

    <div class="linha">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" autocomplete="given-name" required>
        <span class="ajuda" id="ajudaNome"></span>
      </div>

      <div class="campo">
        <label for="sobrenome">Sobrenome</label>
        <input type="text" id="sobrenome" name="sobrenome" placeholder="Seu sobrenome" autocomplete="family-name" required>
        <span class="ajuda" id="ajudaSobrenome"></span>
      </div>
    </div>

    <div class="campo">
      <label for="cpf">CPF</label>
      <input
        type="text"
        id="cpf"
        name="cpf"
        placeholder="000.000.000-00"
        maxlength="14"
        required
      >
      <span class="ajuda" id="ajudaCPF"></span>
    </div>

    <div class="campo">
      <label for="nascimento">Nascimento</label>
      <input
        type="text"
        id="nascimento"
        name="nascimento"
        placeholder="XX/XX/XXXX"
        maxlength="10"
        required
      >
      <span class="ajuda" id="ajudaNascimento"></span>
    </div>

    <div class="linha">
      <div class="campo">
        <label for="telefone">Número de telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" autocomplete="tel" required>
        <span class="ajuda" id="ajudaTelefone"></span>
      </div>

      <div class="campo">
        <label for="sexo">Sexo</label>
        <select id="sexo" name="sexo" required>
          <option value="">Selecione</option>
          <option value="feminino">Feminino</option>
          <option value="masculino">Masculino</option>
          <option value="outro">Outro</option>
          <option value="nao-informar">Prefiro não informar</option>
        </select>
        <span class="ajuda" id="ajudaSexo"></span>
      </div>
    </div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
      <span class="ajuda" id="ajudaEmail"></span>
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Crie uma senha" autocomplete="new-password" required>
      <span class="ajuda" id="ajudaSenha">Mínimo de 8 caracteres.</span>
    </div>

    <div class="linha">

      <div class="campo">
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" placeholder="Cidade" required>
        <span class="ajuda" id="ajudaCidade"></span>
      </div>

      <div class="campo">
        <label for="estado">Estado</label>
        <input type="text" id="estado" name="estado" placeholder="Sigla do estado" maxlength="2" required>
        <span class="ajuda" id="ajudaEstado"></span>
      </div>
    </div>

    <div class="linha">
      <div class="campo">
        <label for="rua">Rua</label>
        <input type="text" id="rua" name="rua" placeholder="Rua" required>
        <span class="ajuda" id="ajudaRua"></span>
      </div>

      <div class="campo">
        <label for="numero">Número</label>
        <input type="text" id="numero" name="numero" placeholder="Número" required>
        <span class="ajuda" id="ajudaNumero"></span>
      </div>
    </div>

    <div class="campo">
        <label for="complemento">Complemento</label>
        <input type="text" id="complemento" name="complemento" placeholder="Casa, apto, ponto de referência, etc.">
        <span class="ajuda" id="ajudaComplemento"></span>
      </div>

    <button type="submit" class="btn btn-primario">Criar conta</button>
  </form>

  <p class="rodape-painel">Já tem uma conta? <a href="login.html">Entrar</a></p>
</div>

<script>
document.getElementById('formCadastro').addEventListener('submit', function(e){
  e.preventDefault();

  const campos = {
    nome: document.getElementById('nome'),
    sobrenome: document.getElementById('sobrenome'),
    cpf: document.getElementById('cpf'),
    nascimento: document.getElementById('nascimento'),
    telefone: document.getElementById('telefone'),
    sexo: document.getElementById('sexo'),
    email: document.getElementById('email'),
    senha: document.getElementById('senha'),
    cidade: document.getElementById('cidade'),
    estado: document.getElementById('estado'),
    rua: document.getElementById('rua'),
    numero: document.getElementById('numero'),
    complemento: document.getElementById('complemento'),
  };

  let valido = true;

  function validar(campo, ajuda, mensagem, condicao){
    if(!condicao){
      campo.classList.add('erro');
      ajuda.textContent = mensagem;
      ajuda.classList.add('erro');
      valido = false;
    } else {
      campo.classList.remove('erro');
      ajuda.textContent = '';
      ajuda.classList.remove('erro');
    }
  }

  validar(
    campos.nome,
    document.getElementById('ajudaNome'),
    'Digite seu nome.',
    campos.nome.value.trim().length >= 2
  );

  validar(
    campos.sobrenome,
    document.getElementById('ajudaSobrenome'),
    'Digite seu sobrenome.',
    campos.sobrenome.value.trim().length >= 2
  );

  const cpfNumeros = campos.cpf.value.replace(/\D/g, '').replace('.','').replace('-','');
  validar(
    campos.cpf,
    document.getElementById('ajudaCPF'),
    'Digite um CPF válido.',
    cpfNumeros.length == 11
  );

  const nascimentoNumeros = campos.nascimento.value.replace(/\D/g, '').replace('/','')
  validar(
    campos.nascimento,
    document.getElementById('ajudaNascimento'),
    'Digite uma data válida.',
    nascimentoNumeros.length == 8
  );

  const telefoneNumeros = campos.telefone.value.replace(/\D/g, '');
  validar(
    campos.telefone,
    document.getElementById('ajudaTelefone'),
    'Digite um telefone válido.',
    telefoneNumeros.length >= 10
  );

  validar(
    campos.sexo,
    document.getElementById('ajudaSexo'),
    'Selecione uma opção.',
    campos.sexo.value !== ''
  );

  const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(campos.email.value.trim());
  validar(
    campos.email,
    document.getElementById('ajudaEmail'),
    'Digite um e-mail válido.',
    emailValido
  );

  validar(
    campos.senha,
    document.getElementById('ajudaSenha'),
    'A senha deve ter pelo menos 8 caracteres.',
    campos.senha.value.length >= 8
  );

  validar(
    campos.cidade,
    document.getElementById('ajudaCidade'),
    'Digite o nome da sua cidade.',
    campos.cidade.value.length > 0
  );

  validar(
    campos.estado,
    document.getElementById('ajudaEstado'),
    'Digite a sigla do seu estado.',
    campos.estado.value.length > 0
  );

  validar(
    campos.rua,
    document.getElementById('ajudaRua'),
    'Digite o nome da sua rua.',
    campos.rua.value.length > 0
  );

  validar(
    campos.numero,
    document.getElementById('ajudaNumero'),
    'Digite o número da sua casa.',
    campos.numero.value.length > 0
  );

  if(valido){
    
    let valorSexo = 0;
    const sexoSelecionado = campos.sexo.value;
    if (sexoSelecionado === 'feminino') valorSexo = 'Feminino';
    else if (sexoSelecionado === 'masculino') valorSexo = 'Masculino';
    else if (sexoSelecionado === 'outro') valorSexo = 'Outro';
    else if (sexoSelecionado === 'nao-informar') valorSexo = 'Nao_Informado';

    const dadosCliente = {
      nome: campos.nome.value.trim(),
      sobrenome: campos.sobrenome.value.trim(),
      cpf: cpfNumeros,
      nascimento: campos.nascimento.value.trim(),
      tel: telefoneNumeros,
      sexo: valorSexo,
      email: campos.email.value.trim(),
      senha: campos.senha.value,
      estado: campos.estado.value.trim(),
      cidade: campos.cidade.value.trim(),
      rua: campos.rua.value.trim(),
      numero: campos.numero.value.trim(),
      complemento: campos.complemento.value.trim()
    };

    fetch('http://192.168.0.111:3000/cliente', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(dadosCliente),
    })
    .then(async response => {
      const resultado = await response.json();
      if (!response.ok) {
        throw new Error(resultado.message || 'Erro ao realizar cadastro.');
      }
      return resultado;
    })
    .then(data => {
      alert('Cadastro realizado com sucesso!');
      window.location.href = 'login.html';
    })
    .catch(error => {
      alert('Erro: ' + error.message);
    });
  }
});

document.querySelectorAll('input, select').forEach(campo => {
  campo.addEventListener('input', () => {
    campo.classList.remove('erro');

    const ajuda = document.getElementById('ajuda' + campo.id.charAt(0).toUpperCase() + campo.id.slice(1));
    if(ajuda){
      ajuda.textContent = campo.id === 'senha' ? 'Mínimo de 8 caracteres.' : '';
      ajuda.classList.remove('erro');
    }
  });

  campo.addEventListener('change', () => {
    campo.classList.remove('erro');

    const ajuda = document.getElementById('ajuda' + campo.id.charAt(0).toUpperCase() + campo.id.slice(1));
    if(ajuda){
      ajuda.textContent = '';
      ajuda.classList.remove('erro');
    }
  });
});

document.getElementById('telefone').addEventListener('input', function(){
  let valor = this.value.replace(/\D/g, '').slice(0, 11);

  if(valor.length <= 10){
    valor = valor.replace(/^(\d{2})(\d)/, '($1) $2');
    valor = valor.replace(/(\d{4})(\d)/, '$1-$2');
  } else {
    valor = valor.replace(/^(\d{2})(\d)/, '($1) $2');
    valor = valor.replace(/(\d{5})(\d)/, '$1-$2');
  }

  this.value = valor;
});

function formatarCPF(valor){
  valor = valor.replace(/\D/g,'').slice(0,11);
  valor = valor.replace(/(\d{3})(\d)/,'$1.$2');
  valor = valor.replace(/(\d{3})(\d)/,'$1.$2');
  valor = valor.replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  return valor;
}


function formatarData(valor){
  valor = valor.replace(/\D/g,'').slice(0,8);
  valor = valor.replace(/(\d{2})(\d)/,'$1/$2');
  valor = valor.replace(/(\d{2})(\d)/,'$1/$2');
  return valor;
}

document.getElementById('cpf').addEventListener('input', function(){
  this.value = formatarCPF(this.value);
});

document.getElementById('nascimento').addEventListener('input', function(){
  this.value = formatarData(this.value);
});

</script>

</body>
</html>
